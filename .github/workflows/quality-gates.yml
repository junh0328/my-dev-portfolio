name: Quality Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "codex/**"]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify harness
        env:
          SKIP_RSS_FETCH: "1"
        run: pnpm verify:harness
